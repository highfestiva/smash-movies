{% extends 'base.html' %}

{% block title %}Home - Top Picks{% endblock %}

{% block content %}
  <h1 class="mb-4">Pick country</h1>
  <div class="list-group">
    {% for country in countries %}
      <div class="mb-3">
        <a class="btn btn-outline-primary btn-sm me-2 mb-2" href="/{{ country }}">{{ country }}</a>
      </div>
    {% else %}
      <p>No movie data available atm. Check back shortly!</p>
    {% endfor %}
  </div>
{% endblock %}
